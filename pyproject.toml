[project]
name = "durable-generation-service"
version = "1.0.0"
description = "Transactional generation API with durable provider fallback"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "pydantic-settings>=2.6,<3", "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv]
package = false
